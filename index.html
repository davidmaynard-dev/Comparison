<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neighborhood Scatter Plot</title>
    <!-- Load D3 Library -->
    <script src="https://d3js.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f7fafc;
            color: #2d3748;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        h1 {
            margin-top: 0;
            font-size: 22px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 12px;
        }
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            background: #edf2f7;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            color: #4a5568;
        }
        select {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            background-color: white;
            width: 100%;
            cursor: pointer;
        }
        #chart {
            display: flex;
            justify-content: center;
            position: relative;
            background: #fff;
        }
        .dot {
            fill: #3182ce;
            fill-opacity: 0.7;
            stroke: #2b6cb0;
            stroke-width: 1px;
        }
        .dot:hover {
            fill: #e53e3e;
            fill-opacity: 1;
            stroke: #9b2c2c;
            stroke-width: 1.5px;
            cursor: pointer;
        }
        .axis-label {
            font-size: 12px;
            font-weight: 600;
            fill: #4a5568;
        }
        .grid line {
            stroke: #e2e8f0;
            shape-rendering: crispEdges;
        }
        .grid path {
            stroke-width: 0;
        }
        .tooltip {
            position: absolute;
            padding: 10px;
            background: rgba(26, 32, 44, 0.95);
            color: #fff;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .error-message {
            color: #9b2c2c;
            background: #fff5f5;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #fed7d7;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Neighborhood Dynamic Scatter Plot</h1>
    
    <div id="error-display" class="error-message"></div>

    <div class="control-panel">
        <div class="control-group">
            <label for="x-select">X-Axis Variable</label>
            <select id="x-select"></select>
        </div>
        <div class="control-group">
            <label for="y-select">Y-Axis Variable</label>
            <select id="y-select"></select>
        </div>
    </div>

    <div id="chart">
        <div id="tooltip" class="tooltip"></div>
    </div>
</div>

<script>
    // Dimensions Setup
    const margin = {top: 20, right: 30, bottom: 60, left: 80};
    const width = 960 - margin.left - margin.right;
    const height = 500 - margin.top - margin.bottom;

    // Canvas Initializations
    const svg = d3.select("#chart")
        .append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
        .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

    const xAxisG = svg.append("g").attr("transform", `translate(0,${height})`);
    const yAxisG = svg.append("g");
    const xGridG = svg.append("g").attr("class", "grid").attr("transform", `translate(0,${height})`);
    const yGridG = svg.append("g").attr("class", "grid");

    const xLabel = svg.append("text").attr("class", "axis-label").attr("text-anchor", "middle").attr("x", width / 2).attr("y", height + 45);
    const yLabel = svg.append("text").attr("class", "axis-label").attr("text-anchor", "middle").attr("transform", "rotate(-90)").attr("x", -height / 2).attr("y", -55);

    let parsedData = [];
    let numericKeys = [];
    const tooltip = d3.select("#tooltip");

    // Clean out all messy formatting symbols ($ , % spaces) from numeric rows
    function cleanNumericValue(val) {
        if (val === undefined || val === null) return 0;
        let str = val.toString().replace(/[\$\s,%!]/g, '').trim();
        if (str === "" || str === "-") return 0;
        let num = parseFloat(str);
        return isNaN(num) ? null : num;
    }

    // Direct fetch tracking demo.csv
    d3.csv("demo.csv").then(data => {
        if (!data || data.length === 0) {
            showError("Empty file structure found. Verify data exists in demo.csv.");
            return;
        }

        // Isolate actual columns names directly from the csv keys
        const rawKeys = Object.keys(data[0]);
        
        // Exclude text columns from mapping as axes metrics
        const excludeList = ["5 year", "year", "neighborhood", "name", "id"];
        numericKeys = rawKeys.filter(k => !excludeList.some(ex => k.toLowerCase().includes(ex)));

        // Map and parse the full dataset securely
        parsedData = data.map(d => {
            let rowObj = {
                // Safely extract whatever variation of neighborhood column text matches
                neighborhood: d["Neighborhood"] || d["neighborhood"] || Object.values(d)[1] || "Unknown Area"
            };
            numericKeys.forEach(k => {
                rowObj[k] = cleanNumericValue(d[k]);
            });
            return rowObj;
        });

        // Populate Dropdowns without strict inner formatting failures
        const xSelect = d3.select("#x-select");
        const ySelect = d3.select("#y-select");

        numericKeys.forEach((key, i) => {
            xSelect.append("option").text(key).attr("value", key).property("selected", i === 0);
            // Default Y axis option to another index so they don't mirror on initial load
            ySelect.append("option").text(key).attr("value", key).property("selected", i === Math.min(2, numericKeys.length - 1));
        });

        // Bind update triggers to changes in the dropdown filters
        xSelect.on("change", updateVisualization);
        ySelect.on("change", updateVisualization);

        // Run primary visual mapping layout pass
        updateVisualization();

    }).catch(error => {
        showError("Unable to locate or parse 'demo.csv'. Check that the file is named exactly 'demo.csv' and matches this directory layout.");
        console.error(error);
    });

    function updateVisualization() {
        const xKey = d3.select("#x-select").property("value");
        const yKey = d3.select("#y-select").property("value");

        // Sync visual labels
        xLabel.text(xKey);
        yLabel.text(yKey);

        // Define plotting map boundaries
        const xScale = d3.scaleLinear()
            .domain(d3.extent(parsedData, d => d[xKey]))
            .range([0, width])
            .nice();

        const yScale = d3.scaleLinear()
            .domain(d3.extent(parsedData, d => d[yKey]))
            .range([height, 0])
            .nice();

        // Render grids
        xGridG.transition().duration(250).call(d3.axisBottom(xScale).tickSize(-height).tickFormat(""));
        yGridG.transition().duration(250).call(d3.axisLeft(yScale).tickSize(-width).tickFormat(""));

        // Render Axis markers
        xAxisG.transition().duration(250).call(d3.axisBottom(xScale));
        yAxisG.transition().duration(250).call(d3.axisLeft(yScale));

        // Coordinate space items rendering update loop
        const selection = svg.selectAll(".dot")
            .data(parsedData);

        // Clear out old nodes
        selection.exit().remove();

        // Update current points smoothly
        selection.transition().duration(250)
            .attr("cx", d => xScale(d[xKey]))
            .attr("cy", d => yScale(d[yKey]));

        // Generate brand new geometric points
        const enterPoints = selection.enter()
            .append("circle")
            .attr("class", "dot")
            .attr("r", 6)
            .attr("cx", d => xScale(d[xKey]))
            .attr("cy", d => yScale(d[yKey]));

        // Setup unified tooltip visibility settings
        enterPoints.merge(selection)
            .on("mouseover", (event, d) => {
                tooltip.style("opacity", 1);
                tooltip.html(`
                    <strong>${d.neighborhood}</strong><br/>
                    <span style="color:#cbd5e0">${xKey}:</span> ${d[xKey] !== null ? d[xKey].toLocaleString() : 'N/A'}<br/>
                    <span style="color:#cbd5e0">${yKey}:</span> ${d[yKey] !== null ? d[yKey].toLocaleString() : 'N/A'}
                `);
            })
            .on("mousemove", (event) => {
                const [mX, mY] = d3.pointer(event, d3.select("#chart").node());
                tooltip
                    .style("left", (mX + 15) + "px")
                    .style("top", (mY - 15) + "px");
            })
            .on("mouseleave", () => {
                tooltip.style("opacity", 0);
            });
    }

    function showError(msg) {
        const box = document.getElementById("error-display");
        box.innerText = msg;
        box.style.display = "block";
    }
