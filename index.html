<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neighborhood Data Explorer</title>
    <!-- Load Plotly.js for charting and PapaParse for CSV parsing -->
    <script src="https://plot.ly"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 40px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: #f1f3f5;
            padding: 15px;
            border-radius: 6px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #495057;
        }
        select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ced4da;
            font-size: 16px;
        }
        #chart {
            width: 100%;
            height: 600px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Neighborhood Socioeconomic Explorer</h2>
    
    <div class="controls">
        <div class="control-group">
            <label for="xAxisSelect">X-Axis Variable</label>
            <select id="xAxisSelect"></select>
        </div>
        <div class="control-group">
            <label for="yAxisSelect">Y-Axis Variable</label>
            <select id="yAxisSelect"></select>
        </div>
    </div>

    <div id="chart"></div>
</div>

<script>
    let rawData = [];
    let variables = new Set();

    // 1. Fetch and parse the CSV file
    // Assumes your CSV file is named "CHANGES.csv" and sits in the same folder
    Papa.parse("CHANGES.csv", {
        download: true,
        header: true,
        dynamicTyping: true,
        complete: function(results) {
            rawData = results.data;
            
            // Extract all unique variables from the data rows
            rawData.forEach(row => {
                if (row.VARIABLE_X) variables.add(row.VARIABLE_X);
                if (row.VARIABLE_Y) variables.add(row.VARIABLE_Y);
            });

            populateDropdowns();
            updateChart();
        }
    });

    // 2. Populate the filter dropdowns dynamically
    function populateDropdowns() {
        const xSelect = document.getElementById('xAxisSelect');
        const ySelect = document.getElementById('yAxisSelect');
        
        const varList = Array.from(variables).sort();
        
        varList.forEach((variable, index) => {
            const optX = new Option(variable, variable);
            const optY = new Option(variable, variable);
            xSelect.add(optX);
            ySelect.add(optY);
        });

        // Set different defaults if possible
        if (varList.length > 1) {
            ySelect.selectedIndex = 1;
        }

        xSelect.addEventListener('change', updateChart);
        ySelect.addEventListener('change', updateChart);
    }

    // 3. Filter data and update the scatter plot matrix
    function updateChart() {
        const selectedX = document.getElementById('xAxisSelect').value;
        const selectedY = document.getElementById('yAxisSelect').value;

        // Map data points by neighborhood to resolve independent rows
        const neighborhoodMap = {};

        rawData.forEach(row => {
            const neighborhood = row.NEIGHBORHOOD;
            if (!neighborhood) return;

            if (!neighborhoodMap[neighborhood]) {
                neighborhoodMap[neighborhood] = { name: neighborhood, x: null, y: null };
            }

            if (row.VARIABLE_X === selectedX) {
                neighborhoodMap[neighborhood].x = cleanValue(row.VALUE_X);
            }
            if (row.VARIABLE_Y === selectedY) {
                neighborhoodMap[neighborhood].y = cleanValue(row.VALUE_Y);
            }
        });

        // Convert mapped entries into coordinate arrays
        const plotData = Object.values(neighborhoodMap).filter(pt => pt.x !== null && pt.y !== null);
        
        const xValues = plotData.map(pt => pt.x);
        const yValues = plotData.map(pt => pt.y);
        const labels = plotData.map(pt => pt.name);

        const trace = {
            x: xValues,
            y: yValues,
            text: labels,
            mode: 'markers',
            type: 'scatter',
            marker: { size: 10, color: '#339af0', opacity: 0.8 }
        };

        const layout = {
            xaxis: { title: selectedX },
            yaxis: { title: selectedY },
            hovermode: 'closest',
            margin: { t: 20 }
        };

        Plotly.newPlot('chart', [trace], layout);
    }

    // Helper to sanitize numeric entries containing dollar signs or commas
    function cleanValue(val) {
        if (typeof val === 'string') {
            const clean = val.replace(/[\$,]/g, '');
            return isNaN(clean) ? null : parseFloat(clean);
        }
        return val;
    }
</script>
</body>
</html>
